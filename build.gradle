plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.40'
    id 'net.darkhax.curseforgegradle' version '1.3.33'
    id 'com.modrinth.minotaur' version '2.10.0'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-forge.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()

    maven {
        url = 'https://maven.minecraftforge.net/'
    }

    maven {
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    implementation "curse.maven:thedragonlib-248055:9411704"
}

sourceSets.main.resources {
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
}

minecraft {
    runs {
        configureEach {
            workingDir = project.file("run-${name}")

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDir = project.file('run')
        }

        server {
            workingDir = project.file('run')
            args '--nogui'
        }


        data {
            workingDir = project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('build/generated-datagen').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

tasks.matching { it.name == 'runData' }.configureEach {
    doLast {
        def datagenOutput = file('build/generated-datagen')
        def clientOutput = file('src/generated/client')
        def serverOutput = file('src/generated/server')

        delete clientOutput
        delete serverOutput

        copy {
            from datagenOutput
            include 'assets/**'
            into clientOutput
        }

        copy {
            from datagenOutput
            include 'data/**'
            into serverOutput
        }

        println ''
        println 'Sword Displays generated resources:'
        println "  Client -> ${clientOutput}"
        println "  Server -> ${serverOutput}"
    }
}

var replaceProperties = [minecraft_version      : minecraft_version,
                         minecraft_version_range: minecraft_version_range,
                         forge_version          : forge_version,
                         forge_version_range    : forge_version_range,
                         loader_version_range   : loader_version_range,
                         mod_id                 : mod_id,
                         mod_name               : mod_name,
                         mod_license            : mod_license,
                         mod_version            : mod_version,
                         mod_authors            : mod_authors,
                         mod_description        : mod_description]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


def releaseName = "${mod_name} ${mod_version} for Forge ${minecraft_version}"

def changelogFile = file('src/main/resources/changelog.md')
def changelogText = changelogFile.exists()
        ? changelogFile.getText('UTF-8')
        : releaseName

tasks.register(
        'publishCurseForge',
        net.darkhax.curseforgegradle.TaskPublishCurseForge
) {
    group = 'publishing'
    description = "Publishes ${mod_name} for Forge to CurseForge"

    apiToken = providers.gradleProperty('curseforge_api_token').orNull

    def projectId = providers.gradleProperty('curseforge_project_id').orNull

    if (projectId) {
        def mainFile = upload(projectId, tasks.named('jar').get())

        mainFile.displayName = releaseName

        mainFile.releaseType = 'release'

        mainFile.changelogType = 'markdown'

        mainFile.changelog = changelogText

        mainFile.addGameVersion(minecraft_version.toString())

        mainFile.addEnvironment('Client', 'Server')

        mainFile.addRequirement('thedragonlib')
    }
}

modrinth {
    token = providers.gradleProperty('modrinth_api_token')
            .orElse(providers.environmentVariable('MODRINTH_TOKEN')).orNull

    projectId = providers.gradleProperty('modrinth_project_id').orNull

    versionNumber = mod_version.toString()
    versionName = releaseName
    versionType = 'release'

    uploadFile = tasks.named('jar').get()

    gameVersions = [minecraft_version.toString()]
    loaders = ['forge']

    changelog = changelogText
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = "Publishes ${mod_name} to Modrinth"

    dependsOn tasks.named('modrinth')
}

tasks.register('publishAll') {
    group = 'publishing'
    description = "Publishes ${mod_name} to CurseForge and Modrinth"

    dependsOn 'publishCurseForge', 'publishModrinth'
}