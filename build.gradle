plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'net.darkhax.curseforgegradle' version '1.1.26'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-neo.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()

    // Curse Maven
    maven {
        url = 'https://www.cursemaven.com'

        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    implementation "curse.maven:thedragonlib-248055:5505781"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()

            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties

    filesMatching([
            'META-INF/neoforge.mods.toml',
            'pack.mcmeta'
    ]) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.register('publishCurseForge',
        net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = "Publishes ${mod_name} ${mod_version} for NeoForge to CurseForge"

    def token = providers.gradleProperty('curseforge_api_token')
            .orElse(providers.environmentVariable('CURSEFORGE_API_TOKEN'))
            .orNull

    def projectId = providers.gradleProperty('curseforge_project_id')
            .orNull

    apiToken = token

    // Validate credentials only when publishing is actually attempted.
    doFirst {
        if (!token) {
            throw new GradleException('Missing curseforge_api_token or CURSEFORGE_API_TOKEN.')
        }

        if (!projectId) {
            throw new GradleException('Missing curseforge_project_id.')
        }
    }

    if (projectId) {
        def mainFile = upload(projectId,
                tasks.named('jar').get())

        mainFile.displayName = "${mod_name} ${mod_version} for NeoForge ${minecraft_version}"

        mainFile.releaseType = 'release'

        def changelogFile = file('src/main/resources/changelog.md')

        mainFile.changelogType = 'markdown'

        mainFile.changelog = changelogFile.exists() ? changelogFile.getText('UTF-8') : "${mod_name} ${mod_version} for NeoForge ${minecraft_version}"

        mainFile.addGameVersion(minecraft_version.toString())

        mainFile.addModLoader('NeoForge')

        mainFile.addEnvironment('Client', 'Server')

        mainFile.addRequirement('thedragonlib')
    }
}