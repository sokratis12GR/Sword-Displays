buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}


plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'net.darkhax.curseforgegradle' version '1.1.26'
    id 'org.spongepowered.mixin' version '0.7.+'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-forge.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    //Game
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    //Required
    implementation fg.deobf("curse.maven:thedragonlib-248055:5498886") //TheDragonLib 1.20.2-1.0.0
//    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.21.1:4.8.2')
//    implementation fg.deobf("curse.maven:armorplus-237366:7077295")

    //Optional
    implementation fg.deobf("curse.maven:jei-238222:6614391") //jei-1.20.1-forge-15.2.0.27.jar
//    implementation fg.deobf("curse.maven:vampirism-become-a-vampire-233029:6289561") //Vampirism (for flight compat test)


}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-forge.jar"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

}


// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea.module { downloadJavadoc = downloadSources = true }

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.register('publishCurseForge',
        net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = "Publishes ${mod_name} ${mod_version} for Forge to CurseForge"

    def token = providers.gradleProperty('curseforge_api_token')
            .orElse(providers.environmentVariable('CURSEFORGE_API_TOKEN'))
            .orNull

    def projectId = providers.gradleProperty('curseforge_project_id')
            .orNull

    apiToken = token

    // Validate credentials only when publishing is actually attempted.
    doFirst {
        if (!token) {
            throw new GradleException('Missing curseforge_api_token or CURSEFORGE_API_TOKEN.')
        }

        if (!projectId) {
            throw new GradleException('Missing curseforge_project_id.')
        }
    }

    if (projectId) {
        def mainFile = upload(projectId,
                tasks.named('jar').get())

        mainFile.displayName = "${mod_name} ${mod_version} for Forge ${minecraft_version}"

        mainFile.releaseType = 'release'

        def changelogFile = file('src/main/resources/changelog.md')

        mainFile.changelogType = 'markdown'

        mainFile.changelog = changelogFile.exists() ? changelogFile.getText('UTF-8') : "${mod_name} ${mod_version} for Forge ${minecraft_version}"

        mainFile.addGameVersion(minecraft_version.toString())

        mainFile.addModLoader('Forge')

        mainFile.addEnvironment('Client', 'Server')

        mainFile.addRequirement('thedragonlib')
    }
}