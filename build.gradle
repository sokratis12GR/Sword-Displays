plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.40'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-forge.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()

    maven {
        url = 'https://maven.minecraftforge.net/'
    }

    maven {
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    implementation "curse.maven:thedragonlib-248055:9012319"
}

sourceSets.main.resources {
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
}

minecraft {
    runs {
        configureEach {
            workingDir = project.file("run-${name}")

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDir = project.file('run')
        }

        server {
            workingDir = project.file('run')
            args '--nogui'
        }


        data {
            workingDir = project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('build/generated-datagen').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

tasks.matching { it.name == 'runData' }.configureEach {
    doLast {
        def datagenOutput = file('build/generated-datagen')
        def clientOutput = file('src/generated/client')
        def serverOutput = file('src/generated/server')

        delete clientOutput
        delete serverOutput

        copy {
            from datagenOutput
            include 'assets/**'
            into clientOutput
        }

        copy {
            from datagenOutput
            include 'data/**'
            into serverOutput
        }

        println ''
        println 'Sword Displays generated resources:'
        println "  Client -> ${clientOutput}"
        println "  Server -> ${serverOutput}"
    }
}

var replaceProperties = [minecraft_version      : minecraft_version,
                         minecraft_version_range: minecraft_version_range,
                         forge_version          : forge_version,
                         forge_version_range    : forge_version_range,
                         loader_version_range   : loader_version_range,
                         mod_id                 : mod_id,
                         mod_name               : mod_name,
                         mod_license            : mod_license,
                         mod_version            : mod_version,
                         mod_authors            : mod_authors,
                         mod_description        : mod_description]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}